name: publish-oci-qualification

on:
  push:
    tags:
      - "oci-qualification-*"

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build qualification publish matrix
        id: matrix
        run: echo "matrix=$(go run ./tools/release-policy-verify --manifest packaging/resources.yaml --publish-matrix)" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_publish-oci-component.yml
    with:
      component: ${{ matrix.component }}
      version: ${{ matrix.version }}
      architecture: all
      registry_prefix: ghcr.io/${{ github.repository_owner }}/kubeclipper/qualification-${{ github.sha }}
      upload_release_input: true
    secrets: inherit

  manifest:
    needs: publish
    runs-on: ubuntu-24.04
    env:
      REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}/kubeclipper/qualification-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: imjasonh/setup-crane@v0.4

      - name: Install manifest dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Download release assembly inputs
        uses: actions/download-artifact@v7
        with:
          pattern: oci-release-input-${{ github.run_id }}-*
          path: ${{ runner.temp }}/kc-release
          merge-multiple: true

      - name: Rebuild merged release metadata
        run: |
          scripts/open-packaging/generate-resource-metadata.sh \
            --resource-dir "$RUNNER_TEMP/kc-release" \
            --image-registry "$REGISTRY_PREFIX"
          echo "RESOURCE_DIR=$RUNNER_TEMP/kc-release" >> "$GITHUB_ENV"

      - name: Resolve release digests and provenance
        run: |
          scripts/open-packaging/generate-release-manifest.sh \
            --build-manifest packaging/resources.yaml \
            --resource-dir "$RESOURCE_DIR" \
            --output "$RESOURCE_DIR/release-manifest.yaml" \
            --package-registry "$REGISTRY_PREFIX" \
            --image-registry "$REGISTRY_PREFIX" \
            --include-bootstrap \
            --arch all \
            --resolve-digests \
            --source-revision "$GITHUB_SHA"
          scripts/open-packaging/verify-release-manifest.sh \
            --manifest "$RESOURCE_DIR/release-manifest.yaml" \
            --registry "$REGISTRY_PREFIX"
          sha256sum "$RESOURCE_DIR/release-manifest.yaml" | tee "$RESOURCE_DIR/release-manifest.yaml.sha256"
          cat "$RESOURCE_DIR/release-manifest.yaml"

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: oci-release-manifest-${{ github.run_id }}
          path: ${{ env.RESOURCE_DIR }}/release-manifest.yaml

  # Round-trip the published qualification release through `kcctl registry
  # sync` into a fresh local registry: proves the offline/mirror path users
  # rely on (ghcr pull auth, digest verification, idempotent re-sync).
  sync-roundtrip:
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}/kubeclipper/qualification-${{ github.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download release manifest
        uses: actions/download-artifact@v7
        with:
          name: oci-release-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/kc-manifest

      - name: Build kcctl
        run: go build -o "$RUNNER_TEMP/kcctl" ./cmd/kcctl

      - name: Start local sync target registry
        run: |
          docker run -d --name kc-sync-target --publish 5000:5000 registry:2
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/v2/ >/dev/null && exit 0
            sleep 1
          done
          echo "local registry did not become ready" >&2
          exit 1

      - name: Sync release from ghcr into local registry
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ghcr-token.pw"
          printf '%s' "$GITHUB_TOKEN" > "$RUNNER_TEMP/ghcr-token.pw"
          "$RUNNER_TEMP/kcctl" registry sync \
            --manifest "$RUNNER_TEMP/kc-manifest/release-manifest.yaml" \
            --source-username "$GITHUB_ACTOR" \
            --source-password-file "$RUNNER_TEMP/ghcr-token.pw" \
            --target 127.0.0.1:5000 \
            --target-scheme http \
            --arch amd64 \
            | tee "$RUNNER_TEMP/sync.log"
          grep -qE 'sync complete: [1-9][0-9]* copied' "$RUNNER_TEMP/sync.log"

      - name: Verify idempotent re-sync
        run: |
          "$RUNNER_TEMP/kcctl" registry sync \
            --manifest "$RUNNER_TEMP/kc-manifest/release-manifest.yaml" \
            --source-username "$GITHUB_ACTOR" \
            --source-password-file "$RUNNER_TEMP/ghcr-token.pw" \
            --target 127.0.0.1:5000 \
            --target-scheme http \
            --arch amd64 \
            | tee "$RUNNER_TEMP/sync2.log"
          grep -qE 'sync complete: 0 copied' "$RUNNER_TEMP/sync2.log"

      - name: Show synced catalog
        run: curl -sf http://127.0.0.1:5000/v2/_catalog | head -c 2000

      - name: Remove ghcr credential file
        if: always()
        run: rm -f "$RUNNER_TEMP/ghcr-token.pw"
