name: publish-bootstrap-console

on:
  workflow_dispatch:
    inputs:
      version:
        description: KubeClipper console version.
        required: true
        default: v1.6.0
        type: string
      architecture:
        description: Target architecture.
        required: true
        default: amd64
        type: choice
        options: [amd64, arm64, all]
      registry_prefix:
        description: GHCR prefix. Defaults to ghcr.io/<repository-owner>/kubeclipper.
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/_publish-oci-component.yml
    with:
      component: bootstrap-console
      version: ${{ inputs.version }}
      architecture: ${{ inputs.architecture }}
      registry_prefix: ${{ inputs.registry_prefix }}
    secrets: inherit
