# 1.setup go env
# 2.build binary
# 3.upload kcctl-only workflow artifacts

name: build-kc

on:
  push:
    branches:
      - 'master'
      - 'release*'

# This ensures that previous jobs for the branch are canceled when the branch is updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version-file: go.mod
      - name: Build
        run:
          KUBE_BUILD_PLATFORMS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64" make build-cli

      - name: Package kcctl-only artifacts
        run: |
          pushd dist
          cp kcctl kcctl-linux-amd64
          cp linux_arm64/kcctl kcctl-linux-arm64
          cp darwin_amd64/kcctl kcctl-darwin-amd64
          cp darwin_arm64/kcctl kcctl-darwin-arm64
          sha256sum kcctl-* > kcctl-checksums.txt
          popd

      - name: Upload kcctl workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kcctl-${{ github.ref_name }}-${{ github.sha }}
          path: |
            dist/kcctl-linux-arm64
            dist/kcctl-linux-amd64
            dist/kcctl-darwin-amd64
            dist/kcctl-darwin-arm64
            dist/kcctl-checksums.txt
          if-no-files-found: error
