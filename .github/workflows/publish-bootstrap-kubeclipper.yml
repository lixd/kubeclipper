name: publish-bootstrap-kubeclipper

on:
  push:
    branches:
      - main
      - master
      - "release-*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional image tag. Empty uses the Git tag or branch mapping.
        required: false
        type: string
      registry_prefix:
        description: GHCR prefix. Defaults to ghcr.io/<repository-owner>/kubeclipper.
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/_publish-oci-component.yml
    with:
      component: bootstrap-kubeclipper
      version: ${{ inputs.version }}
      architecture: all
      registry_prefix: ${{ inputs.registry_prefix }}
    secrets: inherit
