name: publish-bootstrap-registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: Distribution Registry version.
        required: true
        default: 3.1.1
        type: string
      registry_prefix:
        description: GHCR prefix. Defaults to ghcr.io/<repository-owner>/kubeclipper.
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/_publish-oci-component.yml
    with:
      component: bootstrap-registry
      version: ${{ inputs.version }}
      architecture: all
      registry_prefix: ${{ inputs.registry_prefix }}
    secrets: inherit
