# Publish the complete OCI release and kcctl assets for a stable v* tag.

name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  OSS_DOWNLOAD_URL: ${{ vars.OSS_DOWNLOAD_URL || 'https://kubeclipper.oss-ap-southeast-1.aliyuncs.com/kc' }}
  CN_PACKAGE_REGISTRY: registry.cn-hangzhou.aliyuncs.com/kubeclipper-release

jobs:
  prepare:
    if: github.repository == 'kubeclipper/kubeclipper'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate OSS release configuration
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT || 'oss-ap-southeast-1.aliyuncs.com' }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET || 'kubeclipper' }}
          OSS_ACCESS_KEY: ${{ secrets.OSS_ACCESS_KEY }}
          OSS_ACCESS_SECRET: ${{ secrets.OSS_ACCESS_SECRET }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          for name in OSS_ENDPOINT OSS_BUCKET OSS_ACCESS_KEY OSS_ACCESS_SECRET OSS_DOWNLOAD_URL ACR_USERNAME ACR_PASSWORD; do
            [[ -n "${!name}" ]] || {
              echo "$name is required for release publishing" >&2
              exit 1
            }
          done
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          value = os.environ["OSS_DOWNLOAD_URL"]
          url = urlsplit(value)
          if (any(char.isspace() for char in value)
                  or url.scheme != "https" or not url.hostname or url.username is not None
                  or url.password is not None or url.query or url.fragment):
              raise SystemExit("OSS_DOWNLOAD_URL must be a public HTTPS release base URL")
          PY
      - name: Validate release tag and package policy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest_version="$(awk '$1 == "release:" {print $2}' packaging/resources.yaml)"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must be a stable vX.Y.Z version: $RELEASE_TAG" >&2
            exit 1
          }
          [[ "$manifest_version" == "$RELEASE_TAG" ]] || {
            echo "release tag $RELEASE_TAG does not match packaging release $manifest_version" >&2
            exit 1
          }
          go run ./tools/release-policy-verify --manifest packaging/resources.yaml

  release-gate:
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      qualification_run_id: ${{ steps.qualification.outputs.run_id }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install manifest dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: Verify release tag still points at the candidate commit
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]] || {
            echo "release tag $GITHUB_REF_NAME points at $tag_commit, but this workflow runs for $GITHUB_SHA; refusing to release a moved tag" >&2
            exit 1
          }
      - name: Resolve successful qualification run
        id: qualification
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/${{ github.repository }}/actions/workflows/publish-oci-qualification.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100" \
            --jq '[.workflow_runs[]] | first | .id // empty')"
          [[ -n "$run_id" ]] || {
            echo "no successful publish-oci-qualification run for candidate $GITHUB_SHA; qualify the candidate first" >&2
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Resolve acceptance record from candidate refs
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          record_path="docs/testing/acceptance/${CANDIDATE_SHA}.yaml"
          record_file="$RUNNER_TEMP/acceptance-${CANDIDATE_SHA}.yaml"
          found=false

          if [[ -f "$record_path" ]]; then
            cp "$record_path" "$record_file"
            found=true
          fi

          while IFS= read -r ref; do
            git merge-base --is-ancestor "$CANDIDATE_SHA" "$ref" || continue
            git cat-file -e "${ref}:${record_path}" 2>/dev/null || continue
            git show "${ref}:${record_path}" > "$record_file.next"
            if [[ "$found" == true ]]; then
              cmp -s "$record_file" "$record_file.next" || {
                echo "conflicting acceptance records for candidate $CANDIDATE_SHA in fetched refs" >&2
                exit 1
              }
              unlink "$record_file.next"
            else
              mv "$record_file.next" "$record_file"
              found=true
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin refs/heads)

          [[ "$found" == true ]] || {
            echo "no acceptance record for candidate $CANDIDATE_SHA in the candidate commit or a fetched descendant branch" >&2
            exit 1
          }
      - name: Download qualification manifest
        uses: actions/download-artifact@v7
        with:
          pattern: oci-release-manifest-*
          run-id: ${{ steps.qualification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/kc-qualification
          merge-multiple: true
      - name: Enforce release gate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          scripts/open-packaging/release-gate.sh \
            --release-tag "$RELEASE_TAG" \
            --candidate-sha "$GITHUB_SHA" \
            --qualification-manifest "$RUNNER_TEMP/kc-qualification/release-manifest.yaml" \
            --acceptance-record "$RUNNER_TEMP/acceptance-$GITHUB_SHA.yaml"

  build-cli:
    needs: manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download verified release inventory
        uses: actions/download-artifact@v7
        with:
          name: release-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/kc-build-manifest
      - name: Build kcctl
        run: |
          set -euo pipefail
          package_registry="$(awk '$1 == "package:" {print $2; exit}' "$RUNNER_TEMP/kc-build-manifest/release-manifest.yaml")"
          test -n "$package_registry"
          source_package=github.com/kubeclipper/kubeclipper/pkg/delivery/source
          export GOLDFLAGS="-s -w -buildid= -X $source_package.GlobalPackageRegistry=$package_registry -X $source_package.GlobalReleaseBaseURL=https://github.com/${GITHUB_REPOSITORY}/releases/download -X $source_package.CNReleaseBaseURL=${OSS_DOWNLOAD_URL%/}"
          KUBE_BUILD_PLATFORMS="linux/amd64 linux/arm64" make build-cli
      - name: Package kcctl artifacts
        run: |
          set -euo pipefail
          pushd dist
          cp kcctl kcctl-linux-amd64
          cp linux_arm64/kcctl kcctl-linux-arm64
          sha256sum kcctl-linux-amd64 kcctl-linux-arm64 > kcctl-checksums.txt
          popd
      - uses: actions/upload-artifact@v6
        with:
          name: kcctl-release-${{ github.run_id }}
          path: |
            dist/kcctl-linux-amd64
            dist/kcctl-linux-arm64
            dist/kcctl-checksums.txt
          retention-days: 2

  manifest:
    needs: release-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}/kubeclipper/qualification-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@v0.4
      - name: Install manifest dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - uses: actions/download-artifact@v7
        with:
          pattern: oci-release-manifest-*
          run-id: ${{ needs.release-gate.outputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/kc-release
          merge-multiple: true
      - name: Verify approved qualification manifest
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/kc-release/release-manifest.yaml"
          test -f "$manifest"
          scripts/open-packaging/verify-release-manifest.sh \
            --manifest "$manifest" \
            --registry "$REGISTRY_PREFIX"
          sha256sum "$manifest" > "$manifest.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: release-manifest-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kc-release/release-manifest.yaml
            ${{ runner.temp }}/kc-release/release-manifest.yaml.sha256
          retention-days: 2

  cn-registry:
    needs: [build-cli, manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: imjasonh/setup-crane@v0.4
      - name: Install manifest dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - uses: actions/download-artifact@v7
        with:
          name: kcctl-release-${{ github.run_id }}
          path: ${{ runner.temp }}/cn-cli
      - uses: actions/download-artifact@v7
        with:
          name: release-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/cn-manifest
      - name: Import and verify domestic registry
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/cn-cli" && sha256sum --check kcctl-checksums.txt)
          umask 077
          credentials="$(mktemp -d "$RUNNER_TEMP/acr-credentials.XXXXXXXX")"
          trap 'rm -rf "$credentials"' EXIT
          printf '%s' "$ACR_PASSWORD" > "$credentials/password"
          chmod +x "$RUNNER_TEMP/cn-cli/kcctl-linux-amd64"
          KCZONE=global "$RUNNER_TEMP/cn-cli/kcctl-linux-amd64" registry import \
            --manifest "$RUNNER_TEMP/cn-manifest/release-manifest.yaml" \
            --source-username "$GITHUB_ACTOR" --source-password "$GITHUB_TOKEN" \
            --target "$CN_PACKAGE_REGISTRY" --arch all \
            --target-username "$ACR_USERNAME" --target-password-file "$credentials/password"
          DOCKER_CONFIG="$credentials" scripts/open-packaging/verify-release-manifest.sh \
            --manifest "$RUNNER_TEMP/cn-manifest/release-manifest.yaml" \
            --registry "$CN_PACKAGE_REGISTRY"

  github-release:
    needs: [build-cli, manifest, cn-registry]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: kcctl-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@v7
        with:
          name: release-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/release
      - name: Stamp installer release sources
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import shlex

          repository = os.environ["GITHUB_REPOSITORY"]
          domestic = os.environ["OSS_DOWNLOAD_URL"].rstrip("/")
          values = {
              "DEFAULT_VERSION": os.environ["GITHUB_REF_NAME"],
              "DEFAULT_DOWNLOAD_URL": f"https://github.com/{repository}/releases/download",
              "DEFAULT_CN_DOWNLOAD_URL": domestic,
          }
          script = Path("scripts/get-kubeclipper.sh").read_text()
          for name, value in values.items():
              script, count = re.subn(
                  rf"^{name}=.*$", lambda match: f"{name}={shlex.quote(value)}",
                  script, flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"expected exactly one {name} assignment")
          Path(os.environ["RUNNER_TEMP"], "release/get-kubeclipper.sh").write_text(script)
          PY
      - name: Name manifest assets for version downloads
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          mv release-manifest.yaml "release-manifest-${GITHUB_REF_NAME}.yaml"
          rm release-manifest.yaml.sha256
          sha256sum "release-manifest-${GITHUB_REF_NAME}.yaml" > "release-manifest-${GITHUB_REF_NAME}.yaml.sha256"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/release/*
          generate_release_notes: true

  oss-release:
    needs: github-release
    runs-on: ubuntu-24.04
    steps:
      - name: Download the published GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/oss-release" \
            --pattern 'kcctl-linux-amd64' --pattern 'kcctl-linux-arm64' \
            --pattern 'kcctl-checksums.txt' --pattern 'get-kubeclipper.sh' \
            --pattern "release-manifest-${GITHUB_REF_NAME}.yaml" \
            --pattern "release-manifest-${GITHUB_REF_NAME}.yaml.sha256"
      - name: Verify release checksums
        run: |
          cd "$RUNNER_TEMP/oss-release"
          sha256sum --check kcctl-checksums.txt
          sha256sum --check "release-manifest-${GITHUB_REF_NAME}.yaml.sha256"
      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ secrets.OSS_ENDPOINT || 'oss-ap-southeast-1.aliyuncs.com' }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY }}
          access-key-secret: ${{ secrets.OSS_ACCESS_SECRET }}
      - name: Upload versioned release files
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET || 'kubeclipper' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/oss-release"
          for asset in kcctl-linux-amd64 kcctl-linux-arm64 kcctl-checksums.txt "release-manifest-${GITHUB_REF_NAME}.yaml" \
            "release-manifest-${GITHUB_REF_NAME}.yaml.sha256" get-kubeclipper.sh; do
            ossutil cp -f "$asset" "oss://${OSS_BUCKET}/kc/${GITHUB_REF_NAME}/$asset"
          done
      - name: Verify public OSS release files
        run: |
          set -euo pipefail
          check_dir="$(mktemp -d "$RUNNER_TEMP/oss-check.XXXXXXXX")"
          trap 'rm -rf "$check_dir"' EXIT
          base_url="${OSS_DOWNLOAD_URL%/}/${GITHUB_REF_NAME}"
          for asset in kcctl-linux-amd64 kcctl-linux-arm64 kcctl-checksums.txt "release-manifest-${GITHUB_REF_NAME}.yaml" \
            "release-manifest-${GITHUB_REF_NAME}.yaml.sha256" get-kubeclipper.sh; do
            curl --fail --location --show-error --connect-timeout 15 --max-time 300 --retry 3 \
              --output "$check_dir/$asset" "$base_url/$asset"
            cmp "$RUNNER_TEMP/oss-release/$asset" "$check_dir/$asset"
          done
          cd "$check_dir"
          sha256sum --check kcctl-checksums.txt
          sha256sum --check "release-manifest-${GITHUB_REF_NAME}.yaml.sha256"
          for zone in global cn; do
            mkdir "bin-$zone"
            KC_VERSION= KC_DOWNLOAD_URL= KCZONE="$zone" KC_BIN_DIR="$check_dir/bin-$zone" bash get-kubeclipper.sh
            cmp "bin-$zone/kcctl" kcctl-linux-amd64
            "bin-$zone/kcctl" version -o json > "version-$zone.txt"
            python3 - "$GITHUB_REF_NAME" "version-$zone.txt" <<'PY'
          import json
          import sys

          expected, path = sys.argv[1:]
          with open(path, encoding="utf-8") as stream:
              if stream.readline().strip() != "kcctl version:":
                  raise SystemExit("invalid kcctl version output")
              actual = json.load(stream)["gitVersion"]
          if actual != expected:
              raise SystemExit(f"kcctl version mismatch: expected={expected} actual={actual}")
          PY
            KCZONE="$zone" "bin-$zone/kcctl" registry import --target verification.invalid/kubeclipper --dry-run
          done
      - name: Publish root installer
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET || 'kubeclipper' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/oss-release"
          ossutil cp -f get-kubeclipper.sh "oss://${OSS_BUCKET}/get-kubeclipper.sh"
