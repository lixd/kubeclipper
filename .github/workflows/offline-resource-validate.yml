name: offline-resource-validate

on:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/open-packaging/**"
      - ".github/workflows/offline-resource-validate.yml"
      - ".github/workflows/*publish-*.yml"
      - "docs/superpowers/specs/*offline-package*"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          find scripts/open-packaging -name "*.sh" -print0 | xargs -0 bash -n

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Python YAML dependency
        run: |
          python3 - <<'PY'
          import yaml
          print("PyYAML available")
          PY

      - name: Workflow YAML syntax
        run: |
          python3 - <<'PY'
          import yaml

          from glob import glob

          workflows = glob('.github/workflows/*publish-*.yml')
          assert workflows, 'publish workflows not found'
          for workflow in workflows:
              with open(workflow, encoding='utf-8') as stream:
                  yaml.safe_load(stream)
          print(f'{len(workflows)} publish workflow YAML files are valid')
          PY

      - name: Help smoke tests
        run: |
          scripts/open-packaging/build-offline-resources.sh --help >/dev/null
          scripts/open-packaging/generate-resource-metadata.sh --help >/dev/null
          scripts/open-packaging/generate-release-manifest.sh --help >/dev/null
          scripts/open-packaging/push-runtime-images.sh --help >/dev/null
          scripts/open-packaging/verify-release-manifest.sh --help >/dev/null
          scripts/open-packaging/publish-resource-k8s.sh --help >/dev/null
          scripts/open-packaging/publish-resource-containerd.sh --help >/dev/null
          scripts/open-packaging/publish-resource-calico.sh --help >/dev/null
          scripts/open-packaging/bootstrap-builders/build-bootstrap-binaries.sh --help >/dev/null
          scripts/open-packaging/resource-builders/build-k8s-package.sh --help >/dev/null
          scripts/open-packaging/resource-builders/build-containerd-package.sh --help >/dev/null
          scripts/open-packaging/resource-builders/build-calico-package.sh --help >/dev/null
          scripts/open-packaging/resource-builders/build-addon-package.sh --help >/dev/null

      - name: Manifest dry run
        run: |
          scripts/open-packaging/build-offline-resources.sh \
            --manifest packaging/resources.yaml \
            --output /tmp/kc-resource \
            --arch amd64 \
            --dry-run

      - name: Release manifest smoke test
        run: |
          mkdir -p /tmp/kc-release-manifest/k8s/v1.36.1/amd64
          mkdir -p /tmp/kc-release-manifest/calico/v3.31.5/amd64
          touch /tmp/kc-release-manifest/k8s/v1.36.1/amd64/configs.tar.gz
          touch /tmp/kc-release-manifest/calico/v3.31.5/amd64/charts.tgz
          printf 'resource\tversion\tarch\tsourceImage\ttargetImage\n' > /tmp/kc-release-manifest/images.lock
          printf 'k8s\tv1.36.1\tamd64\tregistry.k8s.io/pause:3.10\tghcr.io/lixd/kubeclipper/pause:3.10\n' >> /tmp/kc-release-manifest/images.lock
          printf 'calico\tv3.31.5\tamd64\tdocker.io/calico/node:v3.31.5\tghcr.io/lixd/kubeclipper/calico/node:v3.31.5\n' >> /tmp/kc-release-manifest/images.lock
          scripts/open-packaging/generate-release-manifest.sh \
            --build-manifest packaging/resources.yaml \
            --resource-dir /tmp/kc-release-manifest \
            --include-bootstrap \
            --arch amd64
          python3 - <<'PY'
          import yaml

          with open('/tmp/kc-release-manifest/release-manifest.yaml', encoding='utf-8') as stream:
              manifest = yaml.safe_load(stream)
          artifacts = manifest['artifacts']
          assert manifest['kind'] == 'ReleaseManifest'
          assert len([item for item in artifacts if item['type'] == 'package-image']) == 5
          assert len([item for item in artifacts if item['type'] == 'helm-chart']) == 1
          assert len([item for item in artifacts if item['type'] == 'runtime-image']) == 2
          PY

      - name: Internal dependency scan
        run: scripts/open-packaging/check-open-packaging-sources.sh
