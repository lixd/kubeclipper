name: e2e-aio-test

on:
  push:
    tags:
      - 'oci-qualification-*'
  pull_request:
    branches:
      - 'master'
      - 'release*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KC_CONSOLE_RELEASE_REPOSITORY: ${{ vars.KC_CONSOLE_RELEASE_REPOSITORY || format('{0}/console', github.repository_owner) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Build
        run: |
          version="$(python3 -c 'import yaml; print(yaml.safe_load(open("packaging/resources.yaml"))["bootstrap"]["kubeclipperVersion"])')"
          echo "KUBE_GIT_VERSION=$version" >> "$GITHUB_ENV"
          KUBE_BUILD_PLATFORMS="linux/amd64" KUBE_GIT_VERSION="$version" make build

      - name: Resolve pinned Console revision
        id: console
        run: |
          python3 - <<'PY'
          import os
          import re
          import yaml

          with open('packaging/resources.yaml', encoding='utf-8') as stream:
              revision = yaml.safe_load(stream)['bootstrap']['consoleSourceRevision']
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('consoleSourceRevision must be a full Git commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'revision={revision}\n')
          PY

      - name: Checkout pinned Console source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.KC_CONSOLE_RELEASE_REPOSITORY }}
          ref: ${{ steps.console.outputs.revision }}
          path: dist/.console-source
          fetch-depth: 1

      - name: Set up Node for Console
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'

      - name: Build pinned Console archive
        env:
          EXPECTED_REVISION: ${{ steps.console.outputs.revision }}
        run: |
          set -euo pipefail
          cd dist/.console-source
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          corepack enable
          yarn install --frozen-lockfile
          bash -e build.sh true
          tar -czf "$RUNNER_TEMP/kc-console.tar.gz" -C dist .
          echo "KC_CONSOLE_ARCHIVE=$RUNNER_TEMP/kc-console.tar.gz" >> "$GITHUB_ENV"

      - name: Start local OCI Registry
        run: |
          docker run --detach --name kc-e2e-registry --publish 5000:5000 registry:2
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5000/v2/ && exit 0
            sleep 1
          done
          docker logs kc-e2e-registry
          exit 1

      - name: Configure local Package Registry client
        run: |
          umask 077
          printf '%s\n' '{"registry":"127.0.0.1:5000","scheme":"http"}' > "$RUNNER_TEMP/package-registry.json"
          echo "KC_PACKAGE_REGISTRY_CONFIG=$RUNNER_TEMP/package-registry.json" >> "$GITHUB_ENV"

      - name: Publish bootstrap package images
        env:
          KC_SOURCE_REVISION: ${{ github.sha }}
          KC_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tools_dir="$RUNNER_TEMP/kc-publish-tools"
          mkdir -p "$tools_dir"
          go build -o "$tools_dir/oci-publish" ./tools/oci-publish
          export KC_OCI_PUBLISH_BIN="$tools_dir/oci-publish"
          scripts/open-packaging/publish-bootstrap-kubeclipper.sh \
            --registry-prefix 127.0.0.1:5000 --version "$KUBE_GIT_VERSION" --arch amd64
          bootstrap_version() {
            python3 -c 'import sys, yaml; print(yaml.safe_load(open("packaging/resources.yaml"))["bootstrap"][sys.argv[1]])' "$1"
          }
          scripts/open-packaging/publish-bootstrap-etcd.sh \
            --registry-prefix 127.0.0.1:5000 --version "$(bootstrap_version etcdVersion)" --arch amd64
          scripts/open-packaging/publish-bootstrap-console.sh \
            --registry-prefix 127.0.0.1:5000 --version "$(bootstrap_version consoleVersion)" --arch amd64
          scripts/open-packaging/publish-bootstrap-registry.sh \
            --registry-prefix 127.0.0.1:5000 --version "$(bootstrap_version registryVersion)" --arch amd64

      - name: Deploy KubeClipper from OCI
        run: |
          set -euo pipefail
          interface_pattern="$(python3 - <<'PY'
          import json
          import re
          import subprocess

          routes = json.loads(subprocess.check_output(
              ['ip', '-j', '-4', 'route', 'get', '1.1.1.1'], text=True,
          ))
          if not routes or not routes[0].get('dev'):
              raise SystemExit('no IPv4 route interface is available for AIO deployment')
          print('^' + re.escape(routes[0]['dev']) + '$')
          PY
          )"
          sudo cp ./dist/kcctl /usr/local/bin/kcctl
          sudo kcctl deploy \
            --package-registry 127.0.0.1:5000 \
            --package-registry-scheme http \
            --ip-detect "interface=$interface_pattern" \
            --node-ip-detect "interface=$interface_pattern" \
            --assumeyes
          sudo rm -rf /tmp/kc

      - name: Login and run fast E2E
        run: |
          echo 'root:Thinkbig1' | sudo chpasswd
          sudo mkdir -p /etc/ssh/sshd_config.d
          printf 'PasswordAuthentication yes\nPermitRootLogin yes\n' | sudo tee /etc/ssh/sshd_config.d/99-kubeclipper-e2e.conf >/dev/null
          sudo systemctl restart ssh
          sudo sshd -T | grep -q '^passwordauthentication yes$'
          sudo sshd -T | grep -q '^permitrootlogin yes$'
          make build-e2e
          kcctl login -H http://localhost:80  -u admin -p Thinkbig1
          ./dist/e2e.test -cluster-install-short-timeout=10m -ginkgo.focus="\[Fast\]"

      - name: Clean test environment
        if: always()
        run: |
          if sudo test -f /root/.kc/deploy-config.yaml; then
            sudo kcctl clean --all --force --assumeyes
          fi

      - name: Remove local OCI Registry
        if: always()
        run: |
          set -euo pipefail
          registry_id="$(docker container ls --all --filter 'name=^/kc-e2e-registry$' --format '{{.ID}}')"
          if [[ -n "$registry_id" ]]; then
            docker rm --force "$registry_id"
          fi
