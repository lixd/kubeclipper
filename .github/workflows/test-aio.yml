name: e2e-aio-test

on:
  push:
    tags:
      - 'oci-qualification-*'
  pull_request:
    branches:
      - 'master'
      - 'release*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: KUBE_BUILD_PLATFORMS="linux/amd64" make build

      - name: Start local OCI Registry
        run: |
          docker run --detach --name kc-e2e-registry --publish 5000:5000 registry:2
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5000/v2/ && exit 0
            sleep 1
          done
          docker logs kc-e2e-registry
          exit 1

      - name: Configure local Package Registry client
        run: |
          umask 077
          printf '%s\n' '{"registry":"127.0.0.1:5000","scheme":"http"}' > "$RUNNER_TEMP/package-registry.json"
          echo "KC_PACKAGE_REGISTRY_CONFIG=$RUNNER_TEMP/package-registry.json" >> "$GITHUB_ENV"

      - name: Publish bootstrap package images
        env:
          KC_SOURCE_REVISION: ${{ github.sha }}
        run: |
          tools_dir="$RUNNER_TEMP/kc-publish-tools"
          mkdir -p "$tools_dir"
          go build -o "$tools_dir/oci-publish" ./tools/oci-publish
          export KC_OCI_PUBLISH_BIN="$tools_dir/oci-publish"
          scripts/open-packaging/publish-bootstrap-kubeclipper.sh \
            --registry-prefix 127.0.0.1:5000 --version pr-e2e --arch amd64
          scripts/open-packaging/publish-bootstrap-etcd.sh \
            --registry-prefix 127.0.0.1:5000 --version 3.5.21 --arch amd64
          scripts/open-packaging/publish-bootstrap-console.sh \
            --registry-prefix 127.0.0.1:5000 --version v1.6.0 --arch amd64
          scripts/open-packaging/publish-bootstrap-registry.sh \
            --registry-prefix 127.0.0.1:5000 --version 3.1.1 --arch amd64

      - name: Deploy KubeClipper from OCI
        run: |
          sudo cp ./dist/kcctl /usr/local/bin/kcctl
          sudo kcctl deploy \
            --package-registry 127.0.0.1:5000 \
            --package-registry-scheme http \
            --ip-detect interface=eth0 \
            --node-ip-detect interface=eth0 \
            --assumeyes
          sudo rm -rf /tmp/kc

      - name: Login and run fast E2E
        run: |
          echo 'root:Thinkbig1' | sudo chpasswd
          sudo mkdir -p /etc/ssh/sshd_config.d
          printf 'PasswordAuthentication yes\nPermitRootLogin yes\n' | sudo tee /etc/ssh/sshd_config.d/99-kubeclipper-e2e.conf >/dev/null
          sudo systemctl restart ssh
          sudo sshd -T | grep -q '^passwordauthentication yes$'
          sudo sshd -T | grep -q '^permitrootlogin yes$'
          make build-e2e
          kcctl login -H http://localhost:80  -u admin -p Thinkbig1
          ./dist/e2e.test -cluster-install-short-timeout=10m -ginkgo.focus="\[Fast\]"

      - name: Clean test environment
        if: always()
        run: |
          sudo kcctl clean --all --force --assumeyes
          docker rm --force kc-e2e-registry || true
