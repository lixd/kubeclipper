name: e2e-aio-test

on:
  pull_request:
    branches:
      - 'master'
      - 'release*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: KUBE_BUILD_PLATFORMS="linux/amd64" make build

      - name: Start local OCI Registry
        run: |
          docker run --detach --name kc-e2e-registry --publish 5000:5000 registry:2
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5000/v2/ && exit 0
            sleep 1
          done
          docker logs kc-e2e-registry
          exit 1

      - name: Publish bootstrap package images
        env:
          KC_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p bin
          go build -o bin/oci-publish ./tools/oci-publish
          scripts/open-packaging/publish-bootstrap-kubeclipper.sh \
            --registry-prefix 127.0.0.1:5000 --version pr-e2e --arch amd64
          scripts/open-packaging/publish-bootstrap-etcd.sh \
            --registry-prefix 127.0.0.1:5000 --version 3.5.21 --arch amd64
          scripts/open-packaging/publish-bootstrap-console.sh \
            --registry-prefix 127.0.0.1:5000 --version v1.6.0 --arch amd64

      - name: Deploy KubeClipper from OCI
        run: |
          sudo cp ./dist/kcctl /usr/local/bin/kcctl
          sudo kcctl deploy \
            --package-registry 127.0.0.1:5000 \
            --ip-detect interface=eth0 \
            --node-ip-detect interface=eth0 \
            --assumeyes
          sudo rm -rf /tmp/kc

      - name: Login and run fast E2E
        run: |
          make build-e2e
          kcctl login -H http://localhost:80  -u admin -p Thinkbig1
          ./dist/e2e.test -cluster-install-short-timeout=10m -ginkgo.focus="\[Fast\]"

      - name: Clean test environment
        if: always()
        run: |
          sudo kcctl clean --all --force --assumeyes
          docker rm --force kc-e2e-registry || true
