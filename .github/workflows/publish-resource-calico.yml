name: publish-resource-calico

on:
  push:
    branches:
      - codex/oci-action-test
  workflow_dispatch:
    inputs:
      version:
        description: Calico version.
        required: true
        default: v3.31.5
        type: string
      architecture:
        description: Target architecture.
        required: true
        default: amd64
        type: choice
        options: [amd64, arm64, all]
      registry_prefix:
        description: GHCR prefix. Defaults to ghcr.io/<repository-owner>/kubeclipper.
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_publish-oci-component.yml
    with:
      component: resource-calico
      version: ${{ inputs.version }}
      architecture: ${{ inputs.architecture }}
      registry_prefix: ${{ inputs.registry_prefix }}
    secrets: inherit

  publish-action-test:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        version: [v3.31.5, v3.29.6]
    uses: ./.github/workflows/_publish-oci-component.yml
    with:
      component: resource-calico
      version: ${{ matrix.version }}
      architecture: all
    secrets: inherit
