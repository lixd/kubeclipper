ed through consumers; stable locks, cancellation, idempotence and failure cleanup tested.","status":"implemented-with-evidence"},{"evidence":["pkg/delivery/fetcher/content_test.go:TestContentIngestSurvivesProcessExit","pkg/delivery/fetcher/snapshot_test.go:TestSnapshotProcessExitBoundaries","pkg/delivery/fetcher/oci_test.go"],"id":"A7","note":"Standalone store permissions/resume/commit verified; process exits before commit and publication, corruption repair covered.","status":"implemented-with-evidence"},{"evidence":["pkg/simple/downloader/lifecycle.go","pkg/simple/downloader/lifecycle_test.go","pkg/simple/downloader/cache.go"],"id":"A8","note":"Budget/retention/reserve policies centralized; scaled LRU, partial TTL, active protection and cleanup checks pass.","status":"implemented-with-evidence"},{"evidence":["pkg/delivery/bootstrap/bootstrap_test.go","pkg/component/common/chart.go","pkg/scheme/core/v1/cni/calico.go","pkg/delivery/fetcher/transport_test.go"],"id":"A9","note":"Bootstrap subset filtering and every package consumer lease/path wired; source security checks pass.","status":"implemented-with-evidence"},{"evidence":["docs/oci-acquisition-verification.md","pkg/cli/registry/registry.go"],"id":"A10","note":"No frontend, policy, sync, native Helm transport or runtime image rewrite; independent Registry bootstrap audited. No commit/push/deploy.","status":"implemented-with-evidence"},{"evidence":["docs/oci-acquisition-verification.md","/tmp/kc-oci-runtime-check.py","sh-dev:/tmp/kc-oci-acquisition-20261030/evidence/candidate-4-tests.log","sh-dev:/tmp/kc-oci-acquisition-20261030/evidence/candidate-4-race.log"],"id":"A11","note":"762-file hash-bound isolated sh-dev candidate passes regressions/race/build; provided for independent Runtime Verifier.","status":"implemented-with-evidence"},{"evidence":["sh-dev:/tmp/kc-oci-acquisition-20261030/evidence/candidate-4-ghcr-proxy.log","docs/oci-acquisition-verification.md"],"id":"A12","note":"Candidate-4 real pinned GHCR package cold/warm retrieval and raw/payload verification passed via requested local proxy. Direct route timeout is separate, no install claim.","status":"implemented-with-evidence"}],"addressedAcceptanceIds":["A1","A2","A3","A4","A5","A6","A7","A8","A9","A10","A11","A12"],"checks":[{"name":"affected-package-regressions","note":"sh-dev candidate-4; runtime check validates source hash and exit-zero record","result":"passed"},{"name":"content-and-lifecycle-race","note":"sh-dev candidate-4; runtime check validates source hash and exit-zero record","result":"passed"},{"name":"kcctl-server-agent-build","note":"sh-dev candidate-4; runtime check validates source hash and exit-zero record","result":"passed"},{"name":"real-GHCR-cold-and-warm-package","note":"sh-dev candidate-4; runtime check validates source hash and exit-zero record","result":"passed"}],"knownLimits":["Direct sh-dev GHCR route timed out; proxy route succeeded. No claim of proxy/upstream root cause or network-wide availability.","No platform deployment, cluster creation, power-loss testing or sync/native-Helm/runtime-image rewrite.","Capacity boundaries use scaled budgets and oversize headers rather than allocating tens of GiB.","Earlier failed/timeout runs remain in evidence; only final candidate matching checks are reported passed."],"submittedAt":"2026-10-30T07:56:46.427Z","summary":"Implement finalized OCI package content store, bounded resumable transfer, immutable subset snapshots, protected consumer lifecycle and cache retention. Exact candidate-4 sh-dev tests, race, builds and real GHCR fetch verified; no deployment or Git delivery.","verificationChecks":[{"argv":["/tmp/kc-oci-runtime-check.py"],"cwdRef":".","executable":"/usr/bin/python3","id":"candidate-4-source-and-results","name":"Verify exact local/remote source and sh-dev regression/race/build/GHCR receipts","repeatable":true,"timeoutMs":60000}]},{"candidateId":"f44604f4e406f691946b1b69ce94a56b455aff418a0f273af1a3f6c85be4f15e","candidateInputFingerprintGate":"15e65ce4caaae0e413ea5cd9f07aaa26ddbb4620a894624bd15fd1f44c6b5861","checks":[{"argvDisplay":["/tmp/kc-oci-runtime-check.py"],"cwdRef":".","durationMs":16665,"exitCode":0,"id":"candidate-4-source-and-results","logRef":"native/sdk-checks/df23535e636831d53984140d2dba7405bde35bb7d087cfcd27ec8b94d62c75b8/logs/checks/069da2a053424b624d723fcdd6df4dd6d2303e66c745823d39762e8d42ef71ac-candidate-4-source-and-results.log","logSha256":"050284e2226c9d4a81465f5e4562eb8f442cf9b8a2b2a7ef7bb52c35ae737e85","name":"Verify exact local/remote source and sh-dev regression/race/build/GHCR receipts","status":"passed"}],"completedAt":"2026-10-30T07:57:29.567Z","inputAfter":"ff84e63e18b5f212e748e87da91e9b1146ff0a1eef132a3736f07686c4c9b052","inputBefore":"ff84e63e18b5f212e748e87da91e9b1146ff0a1eef132a3736f07686c4c9b052","inputSnapshot":{"after":"530cf91a9ab164b4c2089aac32d4c21c119434b4e60e611d6e36109fc99049b2","before":"530cf91a9ab164b4c2089aac32d4c21c119434b4e60e611d6e36109fc99049b2","candidateBefore":"15e65ce4caaae0e413ea5cd9f07aaa26ddbb4620a894624bd15fd1f44c6b5861","complete":true,"diagnostics":[],"schema":"comet.native.check-input.v2"}},{"candidateId":"f44604f4e406f691946b1b69ce94a56b455aff418a0f273af1a3f6c85be4f15e","response":{"kind":"final-result","result":{"acceptance":[{"id":"A1","reason":"Reviewed snapshot.go fetchComponent and snapshot_test.go TestRegistrySingleLayerSubsetsAndLocalRebuild: pinned raw manifest and compressed descriptor are stored and independently verified; one layer GET, warm zero-pull, deleted-snapshot fixed-digest offline rebuild. Exact candidate Runtime receipt candidate-4-source-and-results passed; sh-dev regression exit 0.","result":"passed"},{"id":"A2","reason":"pkg/delivery/fetcher/snapshot.go:62-77 hashes original ArtifactContent rather than normalized target file. A valid content {Name:\"agent\",File:\"\"} and equivalent {Name:\"agent\",File:\"agent\"} both extract through contentFile to contents/agent but produce different selection hashes/direc