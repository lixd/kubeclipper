he recorded offset; successful recovery produces the exact expected layer and extracted payload hashes. Exhaustion remains an explicit error and leaves no completed package manifest."},{"id":"A3","source":"brief.md","text":"A resumed 206 must describe the correct requested offset and total length. Wrong ranges fail; an ignored Range returning 200 explicitly restarts safely within the five-request limit, without duplicate appended bytes. Every retry re-enters the original Registry endpoint rather than reusing a signed CDN URL."},{"id":"A4","source":"brief.md","text":"Wrong length, corrupt cached/partial data, wrong layer digest and wrong selected payload digest cannot create a successful package entry or install files as valid. Filesystem write errors and permanent authentication/permission failures do not become unlimited retries."},{"id":"A5","source":"brief.md","text":"Cancellation promptly stops new requests/backoff and returns its error; retry exhaustion preserves recoverable partial data for a later invocation, and a subsequent fetch can resume it. Retry/failure messages expose no credentials or signed query strings."},{"id":"A6","source":"brief.md","text":"Deploy resolves server/agent and the other assets it installs, excluding kcctl; join resolves agent only. Missing required assets and mismatched package identity still fail."},{"id":"A7","source":"brief.md","text":"Existing explicit HTTP, authenticated HTTPS, custom CA, TLS verification, Registry path handling and redirect credential isolation remain correct; targeted delivery/registry/bootstrap/cache regressions pass."},{"id":"A8","source":"brief.md","text":"Build and targeted/race checks run on sh-dev against a task-specific snapshot with a verified file/hash manifest including all current task changes. A real public GHCR package fetch completes with layer and payload verification using the candidate code; report it separately from platform deployment or cluster creation."}],"children":null,"formalHash":"f