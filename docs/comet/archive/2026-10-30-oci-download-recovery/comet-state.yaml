58b5855773ae1ec607","choice":"rejected","proposalHash":"7e1f62bf537025f2859c84175727007e1031f17cb6da763e20778498f4b06130"}},{"id":"oci-download-recovery:6","stepId":"shape.confirm","sequence":6,"status":"resolved","proposal":{"input":{"artifactRootRef":"docs","name":"oci-download-recovery"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"Cold fetch verifies the pinned platform manifest and each required compressed layer once, then scans the supported single rootfs layer locally once. Persist verified manifest bytes and rebuild deleted extraction snapshots with a fixed digest and no network. Valid warm snapshots perform no pull."},{"id":"A2","source":"brief.md","text":"Immutable extraction identity includes normalized selected contents and extraction format version. Order does not affect identity; deploy and join coexist and share raw blobs. Publish the entire synchronized snapshot atomically."},{"id":"A3","source":"brief.md","text":"Bounded streaming extraction validates platform manifest, layer descriptor and selected payload digests separately, preserving configs/charts decompressed payload semantics. Reject duplicate manifest/targets, missing assets, links, unsafe paths, unsupported layer layout and oversize data; document and test concrete limits using real package sizes."},{"id":"A4","source":"brief.md","text":"Real HTTP and HTTP2 body interruptions recover across calls using source/digest/size transactions and the original Registry endpoint. At most five content attempts including the first, exponential jittered backoff starting at one second capped at 30 seconds. No transparent HTTP decompression or uncontrolled nested retry; waits and bodies support cancellation."},{"id":"A5","source":"brief.md","text":"Validate complete 206 ranges; 200 ignoring Range restarts without append. Equal local size is independently verified; oversize data and invalid ranges fail. 416 is not success without complete local verification. Digest, disk and permanent authentication failures stay explicit. Logs/state exclude secrets and signed URLs."},{"id":"A6","source":"brief.md","text":"Cancelable cross-process lifecycle, snapshot and blob locks follow documented order. Results retain protection through every consumer and expose idempotent Release. Multi-component failure releases everything; cleanup cannot delete paths before release. Installed files do not mutate cache through hardlinks."},{"id":"A7","source":"brief.md","text":"Private standalone content store passes resume, commit, permission and crash contracts without a daemon. Partial data never becomes ready. Cache corruption repair drops all locks before exclusive recheck/removal and retries from the start once, then fails explicitly."},{"id":"A8","source":"brief.md","text":"Cleanup excludes active users and stable lock files; uninstall removes only component snapshots. Account all cache data: 20 GiB soft budget, 7-day abandoned staging eligibility, pressure reclamation, 1 GiB reserve, oversized worksets allowed with space, access metadata outside snapshots and no atime dependency. Test LRU and legacy directory recovery without compatibility paths."},{"id":"A9","source":"brief.md","text":"Deploy extracts/distributes only required assets excluding kcctl; join only agent, while transferring the complete shared layer. All package and Chart consumers use exact result paths and protection. Preserve missing-asset failures and existing HTTP/auth/CA/TLS/redirect source rules."},{"id":"A10","source":"brief.md","text":"Frontend, source policy, metadata indexing, native Helm OCI, sync graph copy and runtime-image cache remain outside this change. Audit Registry binary acquisition but do not change independent paths. No fallback, global HTTP2 disable, new daemon/database/public cache knobs, commits, pushes or live deployments."},{"id":"A11","source":"brief.md","text":"Build and appropriate fault, concurrency, crash and race checks run on sh-dev using an isolated allowlisted snapshot verified by file hashes including relevant local dirty/new files. Independent read-only Verifier covers all confirmed criteria; failed, blocked or unrun checks cannot pass."},{"id":"A12","source":"brief.md","text":"Candidate code completes a real public GHCR package pull and raw/payload verification. Distinguish metadata, transfer, installation and cluster creation evidence; preserve current preview, user nodes and dirty worktrees."}],"children":null,"formalHash":"ab2e13268bb6ffb2d0c3c428fa163370bc97b26799b92b4878a0bd1467831595","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"ada4922d8f888bab7d578a5e564ea657e062ea455bf29d667b4cf34bb2dd8500","contractHash":"855997b7c232448abe880910fc96addf9b1f39c332cbe050672a69936b5da64b","inputHash":"722a1894f6473c6f08aedff733525b2f65a88e90fb41d6b2ba5f2ba3a4776b5a","legacyFingerprint":"ac98edce2e4679fa66321557e31202a1058aeed6145390b1a005d564f606145f","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"2502b5bc89d48bb4fa2d07c0f6f0e2808d23a79b090ff96b091636362b22640b","contractHash":"b41c68fbe8d63fa4744434793da848c854692830c58375e03bda3968161cb5da","inputHash":"6fd5a83320e12ac8cd170d1eeff150200e07f6c59c184e1ee3de82d62e004339","legacyFingerprint":"4fa83bb02ea9b7fd685c01640e0af5bd804c4e00536a9aada796e6fbc0cbd2bf","source":"specs/registry-experience/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"faf658757c0effe4209b90193492308f0f0e0c582a46549a36b564aa2d69d5ee","specChanges":[{"base_hash":"87304cd9ae138e3e4fe0a2cad4fc3a94ca0bdf6d3b4c96de482c9293dea6a5a1","capability":"registry-experience","delta_source":"specs/registry-experience/delta.yaml","operation":"modify","source":"specs/registry-experience/spec.md"}]}}},"proposalHash":"1369b424cddb224108fe4b7f568eb09e2f12a4ed5dc303d799fce44b331ca251","choices":["approved"