acceptance:
  - id: A1
    source: brief.md
    text: Cold fetch verifies the pinned platform manifest and each required
      compressed layer once, then scans the supported single rootfs layer
      locally once. Persist verified manifest bytes and rebuild deleted
      extraction snapshots with a fixed digest and no network. Valid warm
      snapshots perform no pull.
    result: passed
    reason:
      text: "Read snapshot.go fetchComponent/extractSnapshot and
        TestRegistrySingleLayerSubsetsAndLocalRebuild: pinned raw platform
        manifest stored by digest, descriptor verified before one local tar
        scan, one cold layer GET, warm reuse and fixed-digest offline rebuild
        after snapshot deletion. Candidate-bound Runtime check :12 passed and
        independently revalidated exact-source remote receipts."
      truncated: false
  - id: A2
    source: brief.md
    text: Immutable extraction identity includes normalized selected contents and
      extraction format version. Order does not affect identity; deploy and join
      coexist and share raw blobs. Publish the entire synchronized snapshot
      atomically.
    result: passed
    reason:
      text: "Read snapshot.go:62-87: File is normalized through contentFile before
        sorting and hashing; extractionVersion included, duplicate targets
        rejected. TestSnapshotSelectionNormalizesEquivalentFiles proves implicit
        and explicit names share identity; subset/order/local-rebuild test
        proves order invariance and separate deploy/join snapshots sharing blob.
        Complete files/receipt fsync then directory rename and parent fsync
        publish atomically."
      truncated: false
  - id: A3
    source: brief.md
    text: Bounded streaming extraction validates platform manifest, layer descriptor
      and selected payload digests separately, preserving configs/charts
      decompressed payload semantics. Reject duplicate manifest/targets, missing
      assets, links, unsafe paths, unsupported layer layout and oversize data;
      document and test concrete limits using real package sizes.
    result: passed
    reason:
      text: "Read extractSnapshot, validateFetchedManifest, verifyPayload and
        rejection/payload tests: raw platform manifest, compressed layer, binary
        payload and decompressed configs/charts digests remain distinct; bounded
        streams reject duplicate manifest/target, missing assets, links, unsafe
        paths and oversize data. Limits 4 MiB manifest, 8 GiB file, 16 GiB
        payload, 32 GiB rootfs/compressed layer documented alongside real
        134400499-byte layer and 86930992/112795829-byte assets. Large limits
        tested using headers/scaled inputs, not multi-GiB allocation."
      truncated: false
  - id: A4
    source: brief.md
    text: Real HTTP and HTTP2 body interruptions recover across calls using
      source/digest/size transactions and the original Registry endpoint. At
      most five content attempts including the first, exponential jittered
      backoff starting at one second capped at 30 seconds. No transparent HTTP
      decompression or uncontrolled nested retry; waits and bodies support
      cancellation.
    result: passed
    reason:
      text: "Read content.go fetch/blobClient and HTTP1/HTTP2 fault tests: at most
        five original-endpoint attempts, exponential base-one-second jitter
        capped at 30 seconds, context-aware backoff/body and cross-call resume.
        DisableCompression and identity encoding preserve byte offsets;
        transport authentication reuses current Registry settings. Passed
        exact-source fetcher/race receipts cover body interruption, ignored
        Range, exhaustion and cancellation."
      truncated: false
  - id: A5
    source: brief.md
    text: Validate complete 206 ranges; 200 ignoring Range restarts without append.
      Equal local size is independently verified; oversize data and invalid
      ranges fail. 416 is not success without complete local verification.
      Digest, disk and permanent authentication failures stay explicit.
      Logs/state exclude secrets and signed URLs.
    result: passed
    reason:
      text: Read strict 206 start/end/total and canonical Content-Range comparison,
        ContentLength checks, ignored-200 truncate, equal-length digest Commit,
        oversize Abort, explicit incomplete-416/auth/digest/disk failures.
        Recovery key hashes source/digest/size with no credentials; URL wrappers
        sanitized. Fault, completed-ingest and /dev/full tests are in passed
        candidate-6 regression.
      truncated: false
  - id: A6
    source: brief.md
    text: Cancelable cross-process lifecycle, snapshot and blob locks follow
      documented order. Results retain protection through every consumer and
      expose idempotent Release. Multi-component failure releases everything;
      cleanup cannot delete paths before release. Installed files do not mutate
      cache through hardlinks.
    result: passed
    reason:
      text: Read LockCache flock polling and lifecycle -> snapshot -> blob lock order;
        stable lock inodes and sync.Once Release. Returned
        FetchResult/ComponentFetchResult hold shared lease until bootstrap
        distribution, upgrade rollout, runtime/Kubernetes extraction and Chart
        Helm command finish. Failure paths release protection; delayed-cleanup,
        concurrent fetch and cross-process tests passed in hash-matched
        regression/race. Consumers copy/unpack rather than mutate cache
        hardlinks.
      truncated: false
  - id: A7
    source: brief.md
    text: Private standalone content store passes resume, commit, permission and
      crash contracts without a daemon. Partial data never becomes ready. Cache
      corruption repair drops all locks before exclusive recheck/removal and
      retries from the start once, then fails explicitly.
    result: passed
    reason:
      text: Read openContent private parents and standalone containerd store usage;
        verified/resume/Commit and corruption-repair path drops
        shared/snapshot/blob locks before cancellable exclusive recheck/removal
        and restarts once. content.go:270-293 now explicitly aborts
        metadata-only ingest with no data and recreates it;
        TestContentIngestSurvivesProcessExit covers metadata-only, partial and
        complete pre-Commit exits. Snapshot staged/published exit tests reject
        incomplete visibility. All are in successful candidate-6 checks.
      truncated: false
  - id: A8
    source: brief.md
    text: "Cleanup excludes active users and stable lock files; uninstall removes
      only component snapshots. Account all cache data: 20 GiB soft budget,
      7-day abandoned staging eligibility, pressure reclamation, 1 GiB reserve,
      oversized worksets allowed with space, access metadata outside snapshots
      and no atime dependency. Test LRU and legacy directory recovery without
      compatibility paths."
    result: passed
    reason:
      text: "Read lifecycle.go cacheObjects/pruneCache: whole ingest directory is now
        a partial eviction unit, including metadata-only/empty directories; all
        metadata bytes accounted and empty directories age from directory mtime.
        New TestPruneMetadataOnlyAndEmptyIngest and
        TestPruneLegacyCompleteAndInterruptedPackages cover prior gaps. Existing
        LRU/access/staging/protection tests cover 20 GiB soft budget, 7-day
        eligibility, pressure collection, 1 GiB reserve and stable locks.
        CleanupPackage uses exclusive lifecycle lock and removes component
        snapshots, retaining shared blobs; native Helm source-marker cache
        preserved."
      truncated: false
  - id: A9
    source: brief.md
    text: Deploy extracts/distributes only required assets excluding kcctl; join
      only agent, while transferring the complete shared layer. All package and
      Chart consumers use exact result paths and protection. Preserve
      missing-asset failures and existing HTTP/auth/CA/TLS/redirect source
      rules.
    result: passed
    reason:
      text: "Read selectedBootstrapContents and bootstrap assertions: deploy excludes
        kcctl, join selects only agent; complete shared layer still transferred.
        Searched every production Fetch/FetchComponent caller and verified
        Release spans actual distribution/unpack/Helm consumption; Calico uses
        returned Chart path within acquireChart protection. Transport tests
        cover HTTP, Basic/wrong password, CA, skip verification, untrusted TLS,
        prefix and cross-host redirect credential isolation. Missing assets
        remain explicit failures."
      truncated: false
  - id: A10
    source: brief.md
    text: Frontend, source policy, metadata indexing, native Helm OCI, sync graph
      copy and runtime-image cache remain outside this change. Audit Registry
      binary acquisition but do not change independent paths. No fallback,
      global HTTP2 disable, new daemon/database/public cache knobs, commits,
      pushes or live deployments.
    result: passed
    reason:
      text: "Reviewed tracked diff and untracked implementation paths: no
        frontend/source policy/indexing/sync graph/runtime-image rewrites, added
        dependencies, daemon/database/public cache knobs or global HTTP2
