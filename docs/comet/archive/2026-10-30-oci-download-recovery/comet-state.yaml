o fetch makes at most five attempts from original Registry endpoint, uses one-second exponential jittered cancellable waits, strict raw encoding and request context; authenticated transport preserves original source and redirects. HTTP1/HTTP2 interrupted-body resume/ignored Range/exhaustion and cross-call cancel tests inspected and covered by passed sh-dev regression/race receipts.","result":"passed"},{"id":"A5","reason":"content.go validates exact 206 start/end/total and ContentLength, truncates ignored Range 200, commits equal-sized ingest through digest verification, rejects oversize and incomplete 416, and surfaces permanent auth/digest/write failures; recovery key hashes source/digest/size and logs sanitize URL wrappers. TestContentCompletedAndOversizedIngest, fault modes and /dev/full write failure are in passing candidate regressions.","result":"passed"},{"id":"A6","reason":"Reviewed lifecycle -> snapshot -> single blob flock order, context-aware polling, shared lifecycle lease returned through FetchResult and ComponentFetchResult with sync.Once Release, failure release, exclusive cleanup, and copy/unpack consumer paths. Inspected cross-process lock, delayed-consumer cleanup, concurrent shared-layer and multi-component failure tests; exact sh-dev race and regression records passed. Installed assets are copied/unpacked, no cache hardlink consumer introduced.","result":"passed"},{"id":"A7","reason":"pkg/delivery/fetcher/content.go:272-275 rejects an existing ingest directory whenever store.Status fails, before permitting Writer recovery, and leaves it indefinitely. Locked containerd v1.6.19 content/local/store.go:544-588 creates directory and ref/timestamps/total before opening data; process exit or creation failure in that real window yields missing-data Status error. Later calls keep returning invalid OCI recovery transaction metadata. Existing crash tests exit after w.Write only, so do not cover this valid pre-data crash boundary. Completed/partial post-write recovery and exclusive corruption repair otherwise present.","result":"failed"},{"id":"A8","reason":"pkg/simple/downloader/lifecycle.go:141-160 skips ingest directories and recognizes transactions only when a data file is encountered. Metadata-only or empty ingest created by containerd before data are absent from size accounting, 7-day reclamation and pressure reclamation, so can accumulate indefinitely; together with A7 same-source acquisition cannot self-recover. Existing retention test constructs data for every ingest and misses this case. Inspected 20 GiB soft budget, 1 GiB reserve, external access metadata, LRU/staging handling and uninstall snapshot-only locking otherwise match scope.","result":"failed"},{"id":"A9","reason":"Reviewed bootstrap selectedBootstrapContents and protected SSH distribution, upgrade held leases, runtime configs/Kubernetes/extension deferred Release, and Calico Chart acquisition plus Helm consumption in same lease using returned path. Bootstrap tests check deploy subset excluding kcctl and join agent-only while raw layer remains complete. Missing assets and current Config auth/TLS/prefix/redirect rules remain explicit; transport tests and affected-package regressions passed.","result":"passed"},{"id":"A10","reason":"Changed implementation is limited to package fetch/content/snapshot/lifecycle and required consumers. Registry bootstrap extractRegistryBinaryToTemp audited as independent; source selection, sync graph, metadata indexing and runtime-image paths not rewritten. Native Helm acquisition preserved with consumption protection. No new dependency, daemon, database, cache knob, fallback or global HTTP2 disable. No deploy, commit or push performed by this verification; .gitignore/.comet existing changes retained.","result":"passed"},{"id":"A11","reason":"Independently reran lightweight /tmp/kc-oci-runtime-check.py: local and sh-dev 762-file allowlist matches manifest SHA256 da71964116582f921b6cd141a1154405d93bb478275dec8616863208bc