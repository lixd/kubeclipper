C_IMAGE_REPO_MIRROR、/etc/kc/kc.env 镜像链路及旧 HTTP/镜像归档安装回退，不做兼容；相关帮助、补全、文档和测试同步。"},{"id":"A9","source":"brief.md","text":"A9：源码和必要测试覆盖在线 GHCR、sync 后内网、路径、缺失错误及升级扩容；资源密集检查在 sh-dev 使用包含本地改动的准确源码，分别记录清单检查、拉取及实际安装结果，不互相替代。"},{"id":"A10","source":"brief.md","text":"A10：保留两仓既有未提交工作；测试环境数据修改和服务替换前检查资源引用与活跃操作，备份可回滚；预览与真实后端候选匹配；未获得提交推送授权不提交推送，后续推送仅用户 fork。"}],"children":null,"formalHash":"5a401eead57d20d6e4d282a5ce78f5489daca383a04c49a763eef22d21923fcd","shapeConfirmationHash":"74c2859ab6a53c62ca2fa71495e52ad86f0739e2577c6cd877a64892783d28ad","specChanges":[{"capability":"registry-experience","operation":"create","source":"specs/registry-experience/spec.md"}]}},{"sequence":39,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"oci-registry-experience"},"outputs":{"verify.report":{"candidateId":"7aa27ecb686e68c9f7da1845eff01f578ef6bded879035b6f8630bf92f6c231a","reportRef":"docs/comet/changes/oci-registry-experience/verification.md","reportSha256":"86a691789d6ef13e190702c0504eea481ada939b0e0b245bb3d0c71766ce6747","stateVersion":25}}}}},{"sequence":38,"value":{"candidateId":"7aa27ecb686e68c9f7da1845eff01f578ef6bded879035b6f8630bf92f6c231a","reportRef":"docs/comet/changes/oci-registry-experience/verification.md","reportSha256":"86a691789d6ef13e190702c0504eea481ada939b0e0b245bb3d0c71766ce6747","stateVersion":25}},{"sequence":40,"value":{"candidateId":"7aa27ecb686e68c9f7da1845eff01f578ef6bded879035b6f8630bf92f6c231a","reportRef":"docs/comet/changes/oci-registry-experience/verification.md","reportSha256":"86a691789d6ef13e190702c0504eea481ada939b0e0b245bb3d0c71766ce6747","stateVersion":25}},{"sequence":41,"value":{"archiveDirRef":"docs/comet/archive/2026-10-29-oci-registry-experience","blockers":[],"candidateBinding":"bbaaf91381aa2be6c1d4870e5e56612bfc60a5375d70f5bb5212d4916a74b186","candidateId":"7aa27ecb686e68c9f7da1845eff01f578ef6bded879035b6f8630bf92f6c231a","capabilityPeers":[],"ready":true,"reportRef":"docs/comet/changes/oci-registry-experience/veri