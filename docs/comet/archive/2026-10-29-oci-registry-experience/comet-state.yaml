d.","result":"passed"},{"id":"A2","reason":"Inspected deploy.Complete explicit flag priority and GHCR default; uploadDefaultRegistry records host/prefix/scheme/auth/CA/TLS and defaultImageRegistry, compares seeded digest plus visible config, and rejects differences without deletion. Matching deploy tests cover initial registration, reuse and conflicts.","result":"passed"},{"id":"A3","reason":"Inspected CompleteClusterImageRegistry, API creation, config metadata and FE default loading: explicit choice wins, omitted selection resolves stored platform default, resolved concrete ref persisted; absence or malformed Registry returns explicit errors. No sole-registry inference.","result":"passed"},{"id":"A4","reason":"Inspected kubeadm, containerd pause template, Calico render, NFS/MetalLB inheritance and OCI delivery source. One selected repository is propagated while package/Chart source stays deployment-configured. Actual registry-preview cluster proof shows Kubernetes and Calico images under offline-shipped, 14 Ready Pods and API readyz ok. This does not establish cold pull or airgap completeness.","result":"passed"},{"id":"A5","reason":"Inspected Create/Confirm/Upgrade FE diff and browser-check-result.json: one required image Registry with API default and full address, no mode or component-default/source panel; concise tooltip. Error/retry, deleted selection and invalid address handling retained. FE source matches tested manifest.","result":"passed"},{"id":"A6","reason":"Inspected shared BE/FE full-address parsers, Registry form conditional auth/cert fields, CLI --address and TablePrint. Scheme/port/path persist separately; invalid and credential-bearing address inputs rejected; address unit tests included in matching suite.","result":"passed"},{"id":"A7","reason":"Inspected version-only upgrade schema and strict JSON rejection, immutable ordinary update, saved-source metadata for lifecycle, CLI source flags removed and readonly Upgrade UI. Obsolete internal Upgrade.ImageRegistry field/assignment/branch is removed. Targeted final k8s/API checks passed; live override test returned HTTP 400.","result":"passed"},{"id":"A8","reason":"Independent search of cmd/pkg and installer finds no KC_REGION/KC_DOWNLOAD_URL/KC_IMAGE env, kc.env, old mode resolver or mirror flag chain. Diff deletes imageproxy and archive import helpers; docs/examples and tests updated; no compatibility conversion added to runtime.","result":"passed"},{"id":"A9","reason":"Local manifests independently match BE 9aa6121d3bf7fdd5d99a825387f0a0901852aca57320885adfe81e35449e5e87 and FE 6c516c723cd6d8d1a1977602bdcc24ff5c8429eb7dea771dbf0abbee22e4c454. Reused matching sh-dev receipts: final k8s/API tests and 3 binaries, delivery suites, 15 FE suites/104 tests, lint zero errors and production build. Scope distinguishes configured source, manifest, and real single-node install; new requested pure-online and isolated-offline exercises remain subsequent work.","result":"passed"},{"id":"A10","reason":"Read baseline and environment receipts: FE prior changes preserved; runtime-before had zero clusters/operations/templates before one-time host/prefix correction and backup. Final node binary receipts match candidate hashes; preview cache-only change has backup/no-store/versioned assets, no source mutation. This readonly verifier made no implementation edits or Git submission. User now authorizes fork OCI delivery; upstream remains unauthorized.","result":"passed"}],"attempt":2,"iteration":2,"risks":["Pure GHCR greenfield deployment and network-isolated offline deployment have not yet been completed; user newly requested these as next validation work.","Current actual cluster evidence is single-node creation; no uncached full image pull, multi-node upgrade, or scale execution is claimed.","FE lint retains five pre-existing warnings."],"summary":"Independent readonly verification passes A1-A10 for unchanged candidate cb24bea993e5e30e0ba36eba8a6f81040760edcd114787f2ab681f4674e9f6b1