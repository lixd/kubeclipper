apiVersion: packaging.kubeclipper.io/v1alpha1
kind: OfflineResourceBuild
release: v1.8.0
architectures:
  - amd64
registries:
  package: ghcr.io/lixd/kubeclipper
  image: ghcr.io/lixd/kubeclipper
bootstrap:
  kubeclipperVersion: v1.8.0
  etcdVersion: 3.5.21
  caddyVersion: 2.10.2
  registry:
    bootstrapImage: registry:2
resources:
  k8s:
    versions:
      - v1.36.1
    kubeadmConfVersion: 0.16.2
  k8sExtension:
    versions:
      - v1
    etcdVersion: 3.5.21
    helmVersion: 3.18.6
    nerdctlVersion: 1.4.0
    cniPluginsVersion: 1.3.0
    calicoVersion: 3.31.5
    conntrack:
      version: 1.4.9
  kcRuntime:
    versions:
      - v1.8.0
  cri:
    containerd:
      versions:
        - 2.2.4
      runcVersion: 1.3.3
      crictlVersion: 1.35.0
  cni:
    calico:
      versions:
        - v3.31.5
      chartName: tigera-operator
      chartVersion: v3.31.5
addons:
  nvidia-dra-driver-gpu:
    enabled: false
    versions:
      - 25.8.0
    chartName: nvidia-dra-driver-gpu
    chartVersion: 25.8.0
  nvidia-gpu-operator:
    enabled: false
    versions:
      - v25.10.0
    chartName: gpu-operator
    chartVersion: 25.10.0
